<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List | Docker Practice App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 550px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
        }

        .header {
            margin-bottom: 24px;
            text-align: center;
        }

        .header h1 {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 6px;
        }

        .header p {
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        .todo-form {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
        }

        .todo-input {
            flex: 1;
            background: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px 16px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .todo-input:focus {
            border-color: var(--primary);
        }

        .btn-add {
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 12px 20px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-add:hover {
            background: var(--primary-hover);
        }

        .status-msg {
            padding: 10px;
            border-radius: 6px;
            font-size: 0.875rem;
            margin-bottom: 16px;
            display: none;
        }

        .status-msg.error {
            background: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.3);
            display: block;
        }

        .todo-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .todo-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 14px 16px;
            transition: border-color 0.2s;
        }

        .todo-item:hover {
            border-color: #475569;
        }

        .todo-text {
            font-size: 0.95rem;
            color: var(--text-main);
            word-break: break-word;
        }

        .btn-delete {
            background: transparent;
            color: var(--danger);
            border: 1px solid var(--danger);
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-delete:hover {
            background: var(--danger);
            color: #fff;
        }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            padding: 24px 0;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📝 To-Do List</h1>
            <p>Docker & Node.js + Express + MongoDB Beginner Practical</p>
        </div>

        <form id="todoForm" class="todo-form">
            <input type="text" id="todoInput" class="todo-input" placeholder="Add a new task..." required autocomplete="off">
            <button type="submit" class="btn-add">Add Task</button>
        </form>

        <div id="statusMsg" class="status-msg"></div>

        <ul id="todoList" class="todo-list">
            <!-- Dynamic Todo items will appear here -->
        </ul>
    </div>

    <script>
        const todoForm = document.getElementById('todoForm');
        const todoInput = document.getElementById('todoInput');
        const todoList = document.getElementById('todoList');
        const statusMsg = document.getElementById('statusMsg');

        // Fetch and display todos
        async function fetchTodos() {
            try {
                statusMsg.className = 'status-msg';
                statusMsg.textContent = '';
                const response = await fetch('/todos');
                if (!response.ok) {
                    throw new Error('Failed to connect to backend server');
                }
                const todos = await response.json();
                renderTodos(todos);
            } catch (error) {
                console.error('Error fetching todos:', error);
                statusMsg.className = 'status-msg error';
                statusMsg.textContent = 'MongoDB Connection Error or Server Unreachable. Please check backend log.';
                todoList.innerHTML = '<div class="empty-state">Unable to load tasks from server.</div>';
            }
        }

        // Render todo list
        function renderTodos(todos) {
            if (!todos || todos.length === 0) {
                todoList.innerHTML = '<div class="empty-state">No tasks yet. Add one above!</div>';
                return;
            }

            todoList.innerHTML = todos.map(todo => `
                <li class="todo-item">
                    <span class="todo-text">${escapeHtml(todo.title)}</span>
                    <button class="btn-delete" onclick="deleteTodo('${todo._id}')">Delete</button>
                </li>
            `).join('');
        }

        // Add a new todo
        todoForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = todoInput.value.trim();
            if (!title) return;

            try {
                const response = await fetch('/todos', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title })
                });

                if (response.ok) {
                    todoInput.value = '';
                    fetchTodos();
                } else {
                    alert('Failed to add todo');
                }
            } catch (error) {
                console.error('Error adding todo:', error);
                alert('Network error while adding todo');
            }
        });

        // Delete a todo
        async function deleteTodo(id) {
            try {
                const response = await fetch(`/todos/${id}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    fetchTodos();
                } else {
                    alert('Failed to delete todo');
                }
            } catch (error) {
                console.error('Error deleting todo:', error);
                alert('Network error while deleting todo');
            }
        }

        // Helper to escape HTML characters
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Initial fetch on page load
        fetchTodos();
    </script>
</body>
</html>
