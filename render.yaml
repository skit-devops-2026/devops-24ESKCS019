services:
  - type: web
    name: devops-24eskcs019
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: MONGO_URL
        fromDatabase:
          name: devops-mongodb
          property: connectionString
    healthCheckPath: /health

databases:
  - name: devops-mongodb
    databaseName: todos
    plan: free
